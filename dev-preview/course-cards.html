<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>노플랜 · 카드형 코스 미리보기</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eeebf5;color:#252239;font-family:Arial,'Malgun Gothic',sans-serif}header{padding:20px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}h1{font-size:18px;margin:0 0 6px}p{font-size:12px;color:#776c89;margin:0;line-height:1.6}nav{display:flex;gap:8px}button{padding:11px 17px;border:1px solid #ddd4ec;border-radius:12px;background:white;color:#6c5790;cursor:pointer}button[aria-pressed=true]{background:#7753d5;color:white;border-color:#7753d5}iframe{display:block;margin:0 auto 20px;width:390px;max-width:calc(100vw - 24px);height:calc(100vh - 115px);min-height:500px;border:1px solid #ddd4ec;border-radius:26px;background:#f8f7fc;box-shadow:0 16px 65px #33234b16}iframe.pc{width:1150px;border-radius:16px}</style></head>
<body><header><div><h1>노플랜 코스 카드 미리보기</h1><p>샘플 데이터 · 코스 카드와 아래 일정을 살펴보세요. 실제 API 호출은 없어요.</p></div><nav aria-label="미리보기 화면 크기"><button aria-pressed="true" id="mobile">모바일</button><button aria-pressed="false" id="pc">PC</button></nav></header>
<iframe title="코스 결과 미리보기" src="./course-cards-content.html"></iframe>
<script>const frame=document.querySelector('iframe');for(const id of ['mobile','pc'])document.getElementById(id).onclick=()=>{frame.classList.toggle('pc',id==='pc');for(const other of ['mobile','pc'])document.getElementById(other).setAttribute('aria-pressed',String(other===id));};</script></body></html>
